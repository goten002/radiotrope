header:
  version: 14
  includes: []

machine: raspberrypi3-64
distro: poky
target: radiotrope-image

# Build directory inside yocto/
build_system: oe

repos:
  # Upstream layers — clone into yocto/ to keep project root clean. Each
  # is pinned to the commit the image was last built with (kas warns
  # about a bare branch); move the pin on purpose, with a rebuild
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    commit: b301218f4da7793624db3545efd8bf66888b77b0
    path: yocto/poky
    layers:
      meta:
      meta-poky:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    branch: scarthgap
    commit: 2c646d29912dcc873469a57b1c207e1549c5094d
    path: yocto/meta-raspberrypi

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    commit: 4d3e2639dec542b58708244662d5ce36810fc510
    path: yocto/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:

  # Pinned: the layer tracks the newest Rust, so an unpinned rebuild could
  # pick up a toolchain the player was never built with
  meta-rust-bin:
    url: https://github.com/rust-embedded/meta-rust-bin.git
    branch: master
    commit: eaea247f32f247ab525112d2fbc16e16a553d880
    path: yocto/meta-rust-bin

  # Our custom layer
  meta-radiotrope:
    path: yocto/meta-radiotrope

local_conf_header:
  base: |
    # Use systemd
    DISTRO_FEATURES:append = " systemd usrmerge"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

    # Build performance
    BB_NUMBER_THREADS ?= "${@bb.utils.cpu_count()}"
    PARALLEL_MAKE ?= "-j ${@bb.utils.cpu_count()}"

    # SD card image — increase boot partition for kernel + DTBs + firmware
    IMAGE_FSTYPES = "rpi-sdimg"
    BOOT_SPACE = "131072"

    # Add merus-amp overlay for InnoMaker AMP Pro HAT
    RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/merus-amp.dtbo"

    # Silent boot: no kernel messages, the radiotrope-splash service draws
    # the splash until the player starts
    CMDLINE:append = " quiet loglevel=0 logo.nologo vt.global_cursor_default=0 console=tty3 systemd.show_status=false"

    # The Pi announces itself as "radiotrope-pi" (default would be the
    # machine name, raspberrypi3-64)
    hostname:pn-base-files = "radiotrope-pi"

    # Accept all licenses for firmware blobs
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

