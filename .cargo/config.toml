# No linker is set for aarch64 here: a native build on a 64-bit Pi or an ARM
# laptop uses the system's `cc`, which exists on every distribution. To
# cross-compile from x86_64 (Debian and Ubuntu name the cross linker this):
#   CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
#     cargo build --target aarch64-unknown-linux-gnu

# `cargo xtask man-and-completions`: see crates/xtask
[alias]
xtask = "run --quiet --package xtask --"
