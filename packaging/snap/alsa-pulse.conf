# ALSA's default device in the snap: PulseAudio, or PipeWire's pulse server.
# The snap reaches it through the audio-playback interface; the sound card
# itself (the alsa interface) is not needed.
pcm.!default {
    type pulse
    fallback "sysdefault"
    hint {
        show on
        description "Default ALSA Output (PulseAudio or PipeWire)"
    }
}

ctl.!default {
    type pulse
    fallback "sysdefault"
}
