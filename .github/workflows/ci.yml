name: CI

on:
  push:
    branches: [main, test/all-upgrades]
  pull_request:
    branches: [main, test/all-upgrades]

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch or PR replaces the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace 2>&1 | tee test.log; then
            grep -E "^test .* FAILED$|panicked at|^error" test.log | head -20 | sed 's/^/::error::/'
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - name: cargo clippy
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log; then
            # Show the first problems as annotations on the run and the PR
            grep -E '(error|warning)(\[[^]]*\])?:' clippy.log | head -20 | sed 's/^/::error::/'
            exit 1
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # Windows is a release target: lint the Windows-only code and run the
  # tests there (MSVC, with CMake for the bundled libopus)
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log; then
            # Show the first problems as annotations on the run and the PR
            grep -E '(error|warning)(\[[^]]*\])?:' clippy.log | head -20 | sed 's/^/::error::/'
            exit 1
          fi
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace 2>&1 | tee test.log; then
            grep -E "^test .* FAILED$|panicked at|^error" test.log | head -20 | sed 's/^/::error::/'
            exit 1
          fi
