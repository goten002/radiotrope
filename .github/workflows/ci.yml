name: CI

on:
  push:
    branches: [main]
  pull_request:
    # polish/*: integration branches whose PRs need the same checks
    branches: [main, 'polish/**']

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch or PR replaces the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - run: cargo check --workspace

  # The oldest Rust the workspace declares (`rust-version` in Cargo.toml),
  # so the README's minimum stays true
  msrv:
    name: Check (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - run: cargo check --workspace --locked

  # The Linux install: desktop file and AppStream metainfo valid, and
  # `make install` puts every file where packages expect it
  packaging:
    name: Linux install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: packaging
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev desktop-file-utils appstream
      - run: desktop-file-validate packaging/linux/app.radiotrope.Radiotrope.desktop
      - run: appstreamcli validate --strict packaging/linux/app.radiotrope.Radiotrope.metainfo.xml
      - run: make PROFILE=dev
      - run: make install PROFILE=dev DESTDIR="$PWD/stage" PREFIX=/usr
      - name: Installed files
        run: find stage -type f | sort
      - name: Programs report their version
        run: |
          for p in radiotrope radiotrope-cli radiotrope-probe; do
            out=$(stage/usr/bin/$p --version)
            echo "$out"
            test "$out" = "$p $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "radiotrope") | .version')"
          done
      - run: make uninstall DESTDIR="$PWD/stage" PREFIX=/usr
      - name: Nothing left after uninstall
        run: test -z "$(find stage -type f)"

  # The Raspberry Pi build (linuxkms backend, no desktop crates): checked
  # here so a desktop change can't break it unnoticed until an image build
  embedded:
    name: Check (embedded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: embedded
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libinput-dev libudev-dev libseat-dev libxkbcommon-dev libdrm-dev libgbm-dev
      - run: cargo check -p radiotrope-app --no-default-features --features embedded

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace 2>&1 | tee test.log; then
            sed 's/\x1b\[[0-9;]*[mK]//g' test.log | grep -E "^test .* FAILED$|panicked at|^error" | head -20 | sed 's/^/::error::/'
            exit 1
          fi

  # AAC+ (HE-AAC) plays through the system's libfdk-aac, loaded at run time.
  # The Test job has no such library, so there the AAC+ tests skip and the
  # built-in decoder is what gets tested. This job covers the rest: the full
  # library (Ubuntu 24.04 has it in multiverse; from 25.10 the package is
  # fdk-aac-free, without HE-AAC), and the build with the loader left out.
  aac:
    name: AAC decoders
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: aac
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - name: Without the system-fdk feature
        run: cargo test -p radiotrope --no-default-features
      - name: The programs build without it
        run: cargo check -p radiotrope-cli -p radiotrope-probe --no-default-features
      # Ubuntu's libfdk-aac2 is the build with HE-AAC taken out, so the
      # full library is built from the upstream source (test only; nothing
      # of it is shipped)
      - name: Install libfdk-aac (with HE-AAC)
        run: |
          git clone --depth 1 --branch v2.0.3 https://github.com/mstorsjo/fdk-aac.git /tmp/fdk-aac
          cmake -S /tmp/fdk-aac -B /tmp/fdk-aac/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/fdk-aac/build -j "$(nproc)"
          sudo cmake --install /tmp/fdk-aac/build
          sudo ldconfig
      - name: With the system's libfdk-aac
        shell: bash
        run: |
          set -o pipefail
          cargo test -p radiotrope aac -- --nocapture 2>&1 | tee aac.log
          # The library must have been found: no AAC+ test may have skipped
          if grep -q "skipped: no libfdk-aac" aac.log; then
            echo "::error::libfdk-aac with HE-AAC was not loaded"
            exit 1
          fi
      - name: No FDK or OpenSSL in the programs
        shell: bash
        run: |
          set -o pipefail
          # Not in what the programs are built from (the fdk-aac crate is a
          # dev-dependency, for making test streams)
          for crate in fdk-aac fdk-aac-sys symphonia-adapter-fdk-aac openssl-sys native-tls; do
            if cargo tree --workspace -e normal,build -i "$crate" 2>/dev/null | grep -q .; then
              echo "::error::$crate is a dependency of the programs"
              exit 1
            fi
          done
          # And not in a built program: no FDK symbols, no linked library
          cargo build -p radiotrope-probe
          bin=target/debug/radiotrope-probe
          if nm -a "$bin" | grep -E "aacDecoder_|aacEncoder_|sbrDecoder_|transportDec_|FDK"; then
            echo "::error::FDK symbols in $bin"
            exit 1
          fi
          if ldd "$bin" | grep -i -E "fdk|libssl|libcrypto"; then
            echo "::error::$bin links FDK or OpenSSL"
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - name: cargo clippy
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log; then
            # Show the first problems as annotations on the run and the PR
            sed 's/\x1b\[[0-9;]*[mK]//g' clippy.log | grep -E '(error|warning)(\[[^]]*\])?:' | head -20 | sed 's/^/::error::/'
            exit 1
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # The UI snapshot tool, which only the `ui-snapshots` feature builds: lint
  # it, run the app's tests with it (the headless dialog and keyboard tests
  # need it), and render every screen in the dark theme (headless, no audio
  # or network). The pictures are kept with the run as the
  # "ui-snapshots-dark" artifact, to look at on a PR.
  snapshots:
    name: UI snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: snapshots
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - name: cargo clippy (ui-snapshots)
        run: cargo clippy -p radiotrope-app --features ui-snapshots --message-format=short -- -D warnings
      - name: cargo test (ui-snapshots)
        run: cargo test -p radiotrope-app --features ui-snapshots
      - name: Render the screens
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY cargo run -p radiotrope-app --features ui-snapshots \
            --bin radiotrope -- --ui-snapshots ui-snapshots --theme dark
          find ui-snapshots -name '*.png' | wc -l
          test -n "$(find ui-snapshots -name '*.png')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots-dark
          path: ui-snapshots/
          if-no-files-found: warn
          retention-days: 14

  # Checks on the Slint sources that the compiler doesn't make: controls
  # need an accessible role, images a role or a label. Stale lines in
  # scripts/ui-semantics-allow.txt fail it too, so the list stays honest.
  ui-lint:
    name: UI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lint-ui-semantics.py

  # Windows is a release target: lint the Windows-only code and run the
  # tests there (MSVC, with CMake for the bundled libopus)
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log; then
            # Show the first problems as annotations on the run and the PR
            sed 's/\x1b\[[0-9;]*[mK]//g' clippy.log | grep -E '(error|warning)(\[[^]]*\])?:' | head -20 | sed 's/^/::error::/'
            exit 1
          fi
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace 2>&1 | tee test.log; then
            sed 's/\x1b\[[0-9;]*[mK]//g' test.log | grep -E "^test .* FAILED$|panicked at|^error" | head -20 | sed 's/^/::error::/'
            exit 1
          fi
      # The exes start with their resources (icon, version details) linked in
      - name: Programs start
        shell: bash
        run: |
          cargo build -p radiotrope-app -p radiotrope-cli -p radiotrope-probe
          for p in radiotrope radiotrope-cli radiotrope-probe; do
            target/debug/$p.exe --version
          done

  # The release packaging's scripts and recipes: shellcheck, the PKGBUILDs'
  # .SRCINFO, the Flatpak manifest. (The packages themselves are built and
  # tried by package-linux.yml, run by hand or by a release.)
  packaging-scripts:
    name: Packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x packaging/linux/*.sh packaging/appimage/build.sh packaging/appimage/AppRun \
            packaging/arch/aur-publish.sh packaging/flatpak/*.sh
      - name: PKGBUILDs parse (makepkg --printsrcinfo)
        run: |
          docker run --rm -v "$PWD/packaging/arch:/arch:ro" archlinux:base-devel bash -c '
            set -e
            useradd -m builder
            cp -r /arch /home/builder/arch && chown -R builder: /home/builder/arch
            cd /home/builder/arch
            su builder -c "makepkg --printsrcinfo"
            su builder -c "makepkg --printsrcinfo -p PKGBUILD-bin"'
      - name: Flatpak manifest is valid YAML with the app id
        run: |
          python3 -c '
          import yaml
          m = yaml.safe_load(open("packaging/flatpak/app.radiotrope.Radiotrope.yml"))
          assert m["id"] == "app.radiotrope.Radiotrope", m["id"]
          assert m["command"] == "radiotrope"
          print("ok:", m["id"], m["runtime"], m["runtime-version"])'
