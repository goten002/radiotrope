[package]
name = "radiotrope-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Terminal internet radio player"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["radio", "tui", "streaming", "internet-radio"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "radiotrope-cli"
path = "src/main.rs"

[features]
default = ["system-fdk"]
# AAC+ (HE-AAC) by the system's libfdk-aac, loaded at run time if it is
# installed. Without it (`--no-default-features`) the build has no FDK code
# at all and plays AAC with the built-in AAC-LC decoder.
system-fdk = ["radiotrope/system-fdk"]

[dependencies]
radiotrope = { path = "../radiotrope", default-features = false }
radiotrope-library = { path = "../radiotrope-library" }
env_logger = { workspace = true }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1"
# Reading the app's settings
serde_json = "1.0"
dirs = "7.0"
# Recording file names carry the start time
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# The app's own code writes the files the CLI reads, so a change to their
# format fails here (test only: the CLI program has none of the app's code)
radiotrope-app = { path = "../radiotrope-app" }

[build-dependencies]
# The Windows exe's icon and version details (Explorer, Task Manager)
radiotrope-build = { path = "../radiotrope-build" }
