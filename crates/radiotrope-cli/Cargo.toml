[package]
name = "radiotrope-cli"
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.92"
description = "Terminal internet radio player"
license = "GPL-3.0-or-later"
authors = ["George Alexiou <goten002@gmail.com>"]
repository = "https://github.com/goten002/radiotrope"
readme = "../../README.md"
keywords = ["radio", "tui", "streaming", "internet-radio"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "radiotrope-cli"
path = "src/main.rs"

[dependencies]
radiotrope = { path = "../radiotrope" }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
# Reading the app's favorites and settings (read only)
serde_json = "1.0"
dirs = "7.0"
# Recording file names carry the start time
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The app's own code writes the files the CLI reads, so a change to their
# format fails here (test only: the CLI program has none of the app's code)
radiotrope-app = { path = "../radiotrope-app" }
