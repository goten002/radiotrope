[package]
name = "radiotrope-library"
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.92"
description = "Radiotrope station directory and favorites persistence"
license = "GPL-3.0-or-later"
repository = "https://github.com/goten002/radiotrope"

[dependencies]
radiotrope = { path = "../radiotrope" }
reqwest = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"
