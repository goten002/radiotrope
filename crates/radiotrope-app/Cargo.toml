[package]
name = "radiotrope-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Desktop internet radio player with Slint UI"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["radio", "gui", "slint", "internet-radio", "streaming"]
categories = ["gui", "multimedia::audio"]

[[bin]]
name = "radiotrope"
path = "src/main.rs"

[dependencies]
radiotrope = { path = "../radiotrope", default-features = false }
radiotrope-library = { path = "../radiotrope-library" }
env_logger = { workspace = true }
slint = { workspace = true }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
# SVG logos (the same resvg Slint draws its SVG icons with)
resvg = { version = "0.50", default-features = false, features = ["text", "memmap-fonts", "raster-images"] }
libc = "0.2"
# MCP server (official Rust SDK), for `radiotrope --mcp`
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
# One player per user: `--mcp` and later launches reach it over a local socket
interprocess = { version = "2.4", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "sync", "time", "net"] }
tokio-util = "0.7"
# Network MCP: Streamable HTTP, optionally over TLS (rustls, as reqwest uses)
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
tower-service = "0.3"
bytes = "1"
# The Stream trait, for the network server's session limits on rmcp's sessions
futures-core = "0.3"
# The network interfaces to offer in the Agents dialog (Linux, Windows)
if-addrs = "0.15"
getrandom = "0.4"
# Remote Control: announce the player to phones on the local network (mDNS)
mdns-sd = { version = "0.22", default-features = false }
# Listening on a phone over WebRTC (Sans-IO; pure-Rust crypto, so it builds
# the same on Linux, Windows and the Pi)
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
# Remote Control over TLS: a certificate the player makes for itself, which
# phones pin when they pair (aws-lc-rs and rcgen already come with str0m)
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws_lc_rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
sha2 = "0.11"
# Updates: checks a download's Minisign (Ed25519) signature; no dependencies
minisign-verify = "0.3"
# Ids for recordings that stand for a file name only in this run
hmac = "0.13"
# The QR code a phone scans to pair
qrcode = { version = "0.15", default-features = false }
rfd = { version = "0.18", optional = true }
# The system tray icon (desktop): Win32 on Windows, D-Bus StatusNotifierItem
# on Linux (ksni, no GTK)
tray-icon = { version = "0.26", default-features = false, features = ["ksni"], optional = true }

[target.'cfg(unix)'.dependencies]
# Quit cleanly on SIGTERM, SIGINT and SIGHUP
signal-hook = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus: WiFi settings over iwd (embedded, on tokio) and whether the
# desktop has a tray to show our icon in (desktop). The tray's own D-Bus
# runs on async-io, which zbus's tokio would take over, so each build turns
# on its own runtime in [features].
zbus = { version = "5", default-features = false, optional = true }
# Hiding a minimized X11 window (already in the tree through winit)
x11rb = { version = "0.14", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
widestring = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# The Objective-C runtime, to answer AppKit's "should the application
# terminate?" with our own Quit (already in the tree through Slint's and
# the tray's AppKit code)
objc2 = { version = "0.6", optional = true }

[features]
default = ["desktop", "system-fdk"]
# AAC+ (HE-AAC) by the system's libfdk-aac, loaded at run time if it is
# installed. Without it (`--no-default-features`) the build has no FDK code
# at all and plays AAC with the built-in AAC-LC decoder.
system-fdk = ["radiotrope/system-fdk"]
desktop = ["slint/backend-default", "slint/renderer-femtovg", "slint/renderer-software", "slint/accessibility", "slint/raw-window-handle-06", "slint/unstable-winit-030", "dep:rfd", "dep:tray-icon", "dep:x11rb", "dep:zbus", "dep:objc2", "zbus/blocking-api", "zbus/async-io"]
embedded = ["slint/backend-linuxkms", "slint/renderer-software", "dep:zbus", "zbus/tokio"]

ui-snapshots = ["slint/renderer-software"]

[dev-dependencies]
# Signs the update tests' files with a key made for the run
minisign = "0.10"

# The headless FemtoVG window of the label tests: an OpenGL context on EGL
# with no surface (glutin is already in the tree through winit)
[target.'cfg(target_os = "linux")'.dev-dependencies]
glutin = { version = "0.32", default-features = false, features = ["egl"] }
# The renderer's own crate (the one Slint uses), for the calls the winit
# backend makes when a window is hidden and shown again. Slint pins it to
# its own version, so this follows `slint`.
i-slint-renderer-femtovg = { version = "1", default-features = false }

[build-dependencies]
slint-build = "1.18"
# The Windows exe's icon and version details (Explorer, Task Manager)
radiotrope-build = { path = "../radiotrope-build" }

# The Linux packages: one `radiotrope` package with all three programs.
# packaging/linux/dist.sh builds the programs, installs everything else into
# target/dist-stage (`make install`, PREFIX=/usr) and then runs
# `cargo deb --no-build` and `cargo generate-rpm`, which read these tables.
# `target/release/...` is where the tools look for the built programs.
[package.metadata.deb]
name = "radiotrope"
section = "sound"
priority = "optional"
maintainer = "George Alexiou <goten002@users.noreply.github.com>"
copyright = "2026 George Alexiou"
license-file = ["../../LICENSE", "0"]
extended-description = """\
An internet radio player for the desktop. Play it yourself, from your phone, \
or let your AI assistant drive it over the Model Context Protocol (MCP). \
Includes radiotrope-cli, a terminal player, and radiotrope-probe, a station \
checker."""
# $auto: the libraries the programs link (from dpkg-shlibdeps). libxkbcommon,
# the GL and display libraries are loaded at run time, so they are named here;
# ca-certificates: HTTPS (rustls) checks servers against the system's roots.
depends = "$auto, libxkbcommon0, ca-certificates"
recommends = "libegl1, libgl1, libwayland-client0, libwayland-cursor0, libwayland-egl1, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2, libxkbcommon-x11-0, libfdk-aac2"
# libfdk-aac2: full AAC+ (HE-AAC), loaded at run time when installed. It is in
# Debian's non-free and Ubuntu's multiverse, so it can't be a hard dependency.
assets = [
    ["target/release/radiotrope", "usr/bin/", "755"],
    ["target/release/radiotrope-cli", "usr/bin/", "755"],
    ["target/release/radiotrope-probe", "usr/bin/", "755"],
    # Launcher, metainfo, icons, man pages, completions, README and licences
    ["../../target/dist-stage/usr/share/**/*", "usr/share/", "644"],
]

[package.metadata.generate-rpm]
name = "radiotrope"
summary = "Internet radio player, with a terminal player and a station checker"
license = "GPL-3.0-or-later"
url = "https://github.com/goten002/radiotrope"
assets = [
    { source = "target/release/radiotrope", dest = "/usr/bin/radiotrope", mode = "755" },
    { source = "target/release/radiotrope-cli", dest = "/usr/bin/radiotrope-cli", mode = "755" },
    { source = "target/release/radiotrope-probe", dest = "/usr/bin/radiotrope-probe", mode = "755" },
    { source = "../../target/dist-stage/usr/share/applications/*", dest = "/usr/share/applications/", mode = "644" },
    { source = "../../target/dist-stage/usr/share/metainfo/*", dest = "/usr/share/metainfo/", mode = "644" },
    { source = "../../target/dist-stage/usr/share/icons/hicolor/*/apps/*", dest = "/usr/share/icons/hicolor/", mode = "644" },
    { source = "../../target/dist-stage/usr/share/man/man1/*", dest = "/usr/share/man/man1/", mode = "644", doc = true },
    { source = "../../target/dist-stage/usr/share/bash-completion/completions/*", dest = "/usr/share/bash-completion/completions/", mode = "644" },
    { source = "../../target/dist-stage/usr/share/zsh/site-functions/*", dest = "/usr/share/zsh/site-functions/", mode = "644" },
    { source = "../../target/dist-stage/usr/share/fish/vendor_completions.d/*", dest = "/usr/share/fish/vendor_completions.d/", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/radiotrope/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/radiotrope/LICENSE", mode = "644", doc = true },
    { source = "../../THIRD-PARTY-LICENSES", dest = "/usr/share/licenses/radiotrope/THIRD-PARTY-LICENSES", mode = "644", doc = true },
]

# Besides the libraries found in the programs (auto-req): the ones loaded at
# run time. Sonames, so Fedora and openSUSE both resolve them.
[package.metadata.generate-rpm.requires]
"libxkbcommon.so.0()(64bit)" = "*"
# HTTPS (rustls) checks servers against the system's certificates
ca-certificates = "*"

# Weak dependencies: installed by default when available, never required.
# Full AAC+ (HE-AAC) needs the complete libfdk-aac: `fdk-aac` from RPM Fusion
# (Fedora) or `libfdk-aac2` from Packman (openSUSE). Not the soname: Fedora's
# own fdk-aac-free provides it too, without HE-AAC, and the app doesn't use it.
[package.metadata.generate-rpm.recommends]
"(fdk-aac or libfdk-aac2)" = ""
"libEGL.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
