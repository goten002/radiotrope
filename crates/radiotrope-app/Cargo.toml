[package]
name = "radiotrope-app"
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.92"
description = "Desktop internet radio player with Slint UI"
license = "GPL-3.0-or-later"
authors = ["George Alexiou <goten002@gmail.com>"]
repository = "https://github.com/goten002/radiotrope"
readme = "../../README.md"
keywords = ["radio", "gui", "slint", "internet-radio", "streaming"]
categories = ["gui", "multimedia::audio"]

[[bin]]
name = "radiotrope"
path = "src/main.rs"

[dependencies]
radiotrope = { path = "../radiotrope" }
slint = { workspace = true }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
libc = "0.2"
# MCP server (official Rust SDK), for `radiotrope --mcp`
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
# One player per user: `--mcp` and later launches reach it over a local socket
interprocess = { version = "2.4", features = ["tokio"] }
# WiFi settings over iwd (embedded only)
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "sync", "time", "net"] }
tokio-util = "0.7"
# Network MCP: Streamable HTTP, optionally over TLS (the system's TLS, as reqwest uses)
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
tower-service = "0.3"
bytes = "1"
getrandom = "0.3"
rfd = { version = "0.17", optional = true }

[target.'cfg(windows)'.dependencies]
widestring = "1"

[features]
default = ["desktop"]
desktop = ["slint/backend-default", "slint/renderer-femtovg", "slint/renderer-software", "slint/accessibility", "slint/raw-window-handle-06", "slint/unstable-winit-030", "dep:rfd"]
embedded = ["slint/backend-linuxkms", "slint/renderer-software", "dep:zbus"]

[build-dependencies]
slint-build = "1.18"
