[package]
name = "radiotrope-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Checks an internet radio station: on air or not, its format, and what is playing"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["radio", "monitoring", "streaming", "internet-radio"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "radiotrope-probe"
path = "src/main.rs"

[dependencies]
radiotrope = { path = "../radiotrope" }
env_logger = { workspace = true }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# MP3 test stations
mp3lame-encoder = { workspace = true }

[build-dependencies]
# The Windows exe's icon and version details (Explorer, Task Manager)
radiotrope-build = { path = "../radiotrope-build" }
