[package]
name = "radiotrope-probe"
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.92"
description = "Checks an internet radio station: on air or not, its format, and what is playing"
license = "GPL-3.0-or-later"
authors = ["George Alexiou <goten002@gmail.com>"]
repository = "https://github.com/goten002/radiotrope"
readme = "../../README.md"
keywords = ["radio", "monitoring", "streaming", "internet-radio"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "radiotrope-probe"
path = "src/main.rs"

[dependencies]
radiotrope = { path = "../radiotrope" }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# MP3 test stations
mp3lame-encoder = { workspace = true }
