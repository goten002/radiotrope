[package]
name = "radiotrope"
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.92"
description = "Internet radio engine - stream resolution, audio playback, and format probing"
license = "GPL-3.0-or-later"
authors = ["George Alexiou <goten002@gmail.com>"]
repository = "https://github.com/goten002/radiotrope"
readme = "../../README.md"
keywords = ["radio", "audio", "streaming", "internet-radio"]
categories = ["multimedia::audio"]

[dependencies]
rodio = { workspace = true }
symphonia = { workspace = true }
symphonia-adapter-libopus = { workspace = true }
symphonia-adapter-fdk-aac = { workspace = true }
rustfft = { workspace = true }
biquad = { workspace = true }
mp3lame-encoder = { workspace = true }
opusic-sys = { workspace = true }
rubato = { workspace = true }
m3u8-rs = { workspace = true }
crossbeam-channel = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
sys-locale = { workspace = true }

# The proxy set in Windows' settings (elsewhere the HTTP_PROXY / HTTPS_PROXY
# variables, which reqwest reads anyway)
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["system-proxy"] }

[dev-dependencies]
mpeg2ts = { workspace = true }
proptest = { workspace = true }
fdk-aac = { workspace = true }
