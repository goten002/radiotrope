[package]
name = "radiotrope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Internet radio engine - stream resolution, audio playback, and format probing"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["radio", "audio", "streaming", "internet-radio"]
categories = ["multimedia::audio"]

[features]
default = ["system-fdk"]
# AAC+ (HE-AAC) by the system's libfdk-aac, loaded at run time if it is
# installed. Without this feature there is no FDK code in the build at all,
# and AAC plays with the built-in AAC-LC decoder.
system-fdk = ["dep:libloading"]

[dependencies]
rodio = { workspace = true }
symphonia = { workspace = true }
symphonia-adapter-libopus = { workspace = true }
rustfft = { workspace = true }
biquad = { workspace = true }
mp3lame-encoder = { workspace = true }
opusic-sys = { workspace = true }
rubato = { workspace = true }
m3u8-rs = { workspace = true }
crossbeam-channel = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
sys-locale = { workspace = true }
libloading = { workspace = true, optional = true }

# The proxy set in Windows' settings (elsewhere the HTTP_PROXY / HTTPS_PROXY
# variables, which reqwest reads anyway)
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["system-proxy"] }

[dev-dependencies]
mpeg2ts = { workspace = true }
proptest = { workspace = true }
fdk-aac = { workspace = true }
