[workspace]
resolver = "2"
members = [
    "crates/radiotrope",
    "crates/radiotrope-cli",
    "crates/radiotrope-app",
    "crates/radiotrope-library",
    "crates/radiotrope-probe",
    "crates/radiotrope-build",
    "crates/xtask",
]
# vendor: patched copies of dependencies (see [patch.crates-io] below)
exclude = ["build", "yocto", "vendor"]

# Shared by every crate (`version.workspace = true` and so on). The crates
# are not published to crates.io: the name `radiotrope` there would be the
# engine library, not the app.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["George Alexiou <goten002@gmail.com>"]
repository = "https://github.com/goten002/radiotrope"
publish = false

[workspace.dependencies]
# Audio
rodio = { version = "0.23", default-features = false, features = ["playback"] }
symphonia = { version = "0.6", default-features = false, features = [
    "ogg", "pcm", "mp3", "aac", "isomp4", "flac", "vorbis", "wav", "id3v1", "id3v2"
] }
symphonia-adapter-libopus = { version = "0.3", features = ["bundled"] }
rustfft = "6.4"
biquad = "0.6"
mp3lame-encoder = "0.3"
opusic-sys = { version = "0.7", default-features = false }
rubato = "5"

# Streaming
m3u8-rs = "6.0"
mpeg2ts = "0.6"
crossbeam-channel = "0.5"

# Network (TLS by rustls, with the system's certificates: no OpenSSL)
reqwest = { version = "0.13", default-features = false, features = [
    "blocking", "rustls", "http2", "form", "json"
] }

### GUI
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "image-default-formats"
] }

# CLI
clap = { version = "4.5", features = ["derive"] }
# Man pages and shell completions, made by `cargo xtask` (not in the programs)
clap_mangen = "0.2"
clap_complete = "4.5"

# Utilities
# Opening the system's libfdk-aac at run time
libloading = "0.8"
thiserror = "2.0"
# The engine reports through the log facade; each program picks a logger
log = "0.4"
env_logger = { version = "0.11", default-features = false }
# Text that stations send in legacy encodings (ICY titles and names)
chardetng = "1.0"
encoding_rs = "0.8"
sys-locale = "0.3"

# Testing
proptest = { version = "1.11", default-features = false, features = ["std"] }
# FDK's AAC encoder, to make AAC and AAC+ test streams. For tests only: the
# programs contain no FDK code (they load the system's libfdk-aac at run
# time, see the engine's `system-fdk` feature)
fdk-aac = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# The copy in vendor/ is Slint 1.19.0's FemtoVG renderer with two fixes
# (vendor/README.md): glyphs drawn on whole pixels (slint-ui/slint#15003,
# upstream from 1.19.1), and the text layouts kept when a window is hidden,
# without which labels keep the width of an earlier text after a hide to the
# tray on Wayland (not upstream yet). Remove this table and
# vendor/i-slint-renderer-femtovg when the Slint in use has both.
[patch.crates-io]
i-slint-renderer-femtovg = { path = "vendor/i-slint-renderer-femtovg" }
# muda 0.21.2 with one change (vendor/README.md): every handler set for menu
# events is called, not only the first. The tray's menu (tray-icon) and the
# macOS menu bar (Slint) both set one. Remove with vendor/muda when muda
# does this itself, or when only one of the two uses it.
muda = { path = "vendor/muda" }
