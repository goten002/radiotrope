[workspace]
resolver = "2"
members = [
    "crates/radiotrope",
    "crates/radiotrope-cli",
    "crates/radiotrope-app",
    "crates/radiotrope-library",
    "crates/radiotrope-probe",
    "crates/radiotrope-build",
    "crates/xtask",
]
exclude = ["build", "yocto"]

# Shared by every crate (`version.workspace = true` and so on). The crates
# are not published to crates.io: the name `radiotrope` there would be the
# engine library, not the app.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["George Alexiou <goten002@gmail.com>"]
repository = "https://github.com/goten002/radiotrope"
publish = false

[workspace.dependencies]
# Audio
rodio = { version = "0.23", default-features = false, features = ["playback"] }
symphonia = { version = "0.6", default-features = false, features = [
    "ogg", "pcm", "mp3", "aac", "isomp4", "flac", "vorbis", "wav", "id3v1", "id3v2"
] }
symphonia-adapter-libopus = { version = "0.3", features = ["bundled"] }
symphonia-adapter-fdk-aac = "0.2"
rustfft = "6.4"
biquad = "0.6"
mp3lame-encoder = "0.3"
opusic-sys = { version = "0.7", default-features = false }
rubato = "5"

# Streaming
m3u8-rs = "6.0"
mpeg2ts = "0.6"
crossbeam-channel = "0.5"

# Network
reqwest = { version = "0.13", default-features = false, features = [
    "blocking", "native-tls", "http2", "form", "json"
] }

### GUI
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "image-default-formats"
] }

# CLI
clap = { version = "4.5", features = ["derive"] }
# Man pages and shell completions, made by `cargo xtask` (not in the programs)
clap_mangen = "0.2"
clap_complete = "4.5"

# Utilities
thiserror = "2.0"
# The engine reports through the log facade; each program picks a logger
log = "0.4"
env_logger = { version = "0.11", default-features = false }
# Text that stations send in legacy encodings (ICY titles and names)
chardetng = "1.0"
encoding_rs = "0.8"
sys-locale = "0.3"

# Testing
proptest = { version = "1.11", default-features = false, features = ["std"] }
# FDK's AAC encoder, to make AAC and AAC+ test streams (the decoder already
# comes with symphonia-adapter-fdk-aac)
fdk-aac = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
